[package]
name = "machinestream-mcp"
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
license = "MIT"
description = "MCP server for MachineStream: remote builds, tests, lints and type checks for AI coding agents"
repository = "https://github.com/contextstream/machinestream-mcp"
homepage = "https://machinestream.io"
readme = "README.md"
keywords = ["mcp", "testing", "ci", "agents", "remote-build"]
categories = ["command-line-utilities", "development-tools"]
publish = false

[[bin]]
name = "machinestream-mcp"
path = "src/main.rs"

[lib]
name = "machinestream_mcp"
path = "src/lib.rs"

[dependencies]
# The remote-check engine (snapshot, stream protocol, catalog, device login) is shared
# with the ContextStream MCP server so results stay identical. See docs/design.md.
mcp-client = { git = "https://github.com/contextstream/mcp-server", tag = "v1.0.103" }
mcp-tools = { git = "https://github.com/contextstream/mcp-server", tag = "v1.0.103" }
mcp-session = { git = "https://github.com/contextstream/mcp-server", tag = "v1.0.103" }
mcp-types = { git = "https://github.com/contextstream/mcp-server", tag = "v1.0.103" }

rmcp = { version = "3.11", default-features = false, features = ["server", "transport-io", "transport-streamable-http-server", "elicitation"] }
tokio = { version = "1.43", features = ["full"] }
tokio-util = "0.7"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.5", features = ["derive"] }
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
regex = "1"
dirs = "7.0"
sha2 = "0.11"
hex = "0.4"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.11", features = ["v4"] }
axum = "0.8"
tempfile = "3.14"
futures = "0.3"
async-trait = "0.1"
url = "2"
toml_edit = "0.25"
open = "5.0"

[dev-dependencies]
tokio-tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
flate2 = "1"
reqwest = { version = "0.12", default-features = false, features = ["json"] }

[profile.release]
lto = "thin"
codegen-units = 4
strip = true
